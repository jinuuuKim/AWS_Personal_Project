      # TransitGatewayAttachmentId: tgw-attach-022a4adc622484ac5

Outputs:
  NATInstance:
    Description: Public IP of NAT Instance
    Value: !GetAtt NATInstance.PublicIp
  SingaporeWEB1:
    Description: Private IP of Singapore WEB1
    Value: !GetAtt SingaporeWEB1.PrivateIp
  IDCDBSRV:
    Description: Public IP of DB SRV
    Value: !GetAtt IDCDBSRV.PublicIp
  IDCDNSSRV:
    Description: Private IP of DNS SRV
    Value: !GetAtt IDCDNSSRV.PublicIp
  IDCCGWInstance:
    Description: Private IP of IDCCGWInstance
    Value: !GetAtt IDCCGWInstance.PublicIp
  SingaporeTransitGatewayID:
    Description: Singapore TransitGateway ID
    Value: !Ref SingaporeTGW