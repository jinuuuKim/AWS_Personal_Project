      # DestinationCidrBlock: 10.1.0.0/16
      # TransitGatewayRouteTableId: tgw-rtb-0775dcb59751e6a54
      # TransitGatewayAttachmentId: tgw-attach-022a4adc622484ac5
  # TGWStaticRoute2:
    # Type: AWS::EC2::TransitGatewayRoute
    # Properties:
      # DestinationCidrBlock: 10.2.0.0/16
