  #########################################################################
  #########################################################################
  ##############################Seoul TGW##################################
  ##############################Seoul TGW##################################
  ##############################Seoul TGW##################################
  #########################################################################
  #########################################################################

  # TGW 생성
  SeoulTGW:
    Type: AWS::EC2::TransitGateway
    Properties:
      Tags:
        - Key: Name
          Value: Seoul-TGW
          
  # TGW - Seoul AWS VPC 연결
  TGWVPCAtt:
    Type: AWS::EC2::TransitGatewayAttachment
    DependsOn: SeoulVPC
    Properties:
      VpcId: !Ref SeoulVPC
      SubnetIds:
        - !Ref SeoulTGWSubnet1
        - !Ref SeoulTGWSubnet2
      TransitGatewayId: !Ref SeoulTGW
      Tags: 
        - Key: Name
          Value: TGW-ATT-SeoulVPC
 
  # AWS VPC TGW 라우팅
  AWSTGWRoute1:
    Type: AWS::EC2::Route
    DependsOn: TGWVPCAtt
    Properties:
      RouteTableId: !Ref SeoulPrivateRT1
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref SeoulTGW
  AWSTGWRoute2:
    Type: AWS::EC2::Route
    DependsOn: TGWVPCAtt
    Properties:
      RouteTableId: !Ref SeoulPrivateRT2
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref SeoulTGW
      
  # IDC 온프레미스 CGW
  IDCCGW:
    Type: AWS::EC2::CustomerGateway
    Properties:
      Type: ipsec.1
      BgpAsn: 65010
      IpAddress: !Ref CGWEIP
      Tags:
        - Key: Name
          Value: IDC-CGW
          
  # TGW와 CGW 사이의 암호화 터널 정의  
  TGWCGWVpnConnection:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      CustomerGatewayId: !Ref IDCCGW
      TransitGatewayId: !Ref SeoulTGW
      VpnTunnelOptionsSpecifications:
        - PreSharedKey: !Ref VpnPreSharedKey
          TunnelInsideCidr: 169.254.178.132/30
        - PreSharedKey: !Ref VpnPreSharedKey
          TunnelInsideCidr: 169.254.154.168/30
      Tags:
        - Key: Name
          Value: TGW-CGW-VPNConnection

