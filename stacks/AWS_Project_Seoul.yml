Parameters:
  RootPassword:
    Description: Root password injected into EC2 UserData. Supply at stack creation.
    Type: String
    NoEcho: true
    MinLength: 8
    ConstraintDescription: must be at least 8 characters
  VpnPreSharedKey:
    Description: Pre-shared key for the Site-to-Site VPN tunnels. Supply at stack creation.
    Type: String
    NoEcho: true
    MinLength: 8
    ConstraintDescription: must be at least 8 characters
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair
  # SingaporeTGW:
    # Description: Name of an Singapore TGW ID
    # Type: String
  LatestAmiId:
    Description: (DO NOT CHANGE)
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
    AllowedValues:
      - /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
      
Resources:
  #########################################################################
  #########################################################################
  ##############################Seoul AWS VPC##############################
  ##############################Seoul AWS VPC##############################
  ##############################Seoul AWS VPC##############################
  #########################################################################
  #########################################################################
  
  # 서울 VPC
  SeoulVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: Seoul-VPC
          
  # Seoul AWS 인터넷 게이트웨이
  SeoulIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Seoul-IGW
  SeoulIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SeoulVPC
      InternetGatewayId: !Ref SeoulIGW
      
  # Seoul NAT 서브넷
  SeoulNATSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.1.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-NATSubnet-1
  SeoulNATSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.2.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-NATSubnet-2
          
  # Seoul WEB Server 서브넷
  SeoulSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.3.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-Subnet-1
  SeoulSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.4.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-Subnet-2
          
  # Seoul TGW 연결용 서브넷
  SeoulTGWSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.5.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-TGWSubnet-1
  SeoulTGWSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.1.6.0/24
      VpcId: !Ref SeoulVPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-TGWSubnet-2
          
  # Seoul AWS 라우팅 테이블
  SeoulPublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: Seoul-Public-RT
  SeoulPrivateRT1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: Seoul-Private-RT1
  SeoulPrivateRT2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: Seoul-Private-RT2
  SeoulTGWAttRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: Name
          Value: Seoul-TGWAtt-RT
          
  # Seoul Public RT 기본 라우팅  
  SeoulPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SeoulIGWAttachment
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SeoulIGW
      
  # Seoul Private RT NAT 인스턴스 라우팅
  SeoulPrivateRoute1:
    Type: AWS::EC2::Route
    DependsOn: NATInstance1
    Properties:
      RouteTableId: !Ref SeoulPrivateRT1
      DestinationCidrBlock: 0.0.0.0/0
      NetworkInterfaceId: !Ref NATEni1
  SeoulPrivateRoute2:
    Type: AWS::EC2::Route
    DependsOn: NATInstance2
    Properties:
      RouteTableId: !Ref SeoulPrivateRT2
      DestinationCidrBlock: 0.0.0.0/0
      NetworkInterfaceId: !Ref NATEni2
  
  # Seoul 라우팅 테이블 연결
  SeoulNATRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      SubnetId: !Ref SeoulNATSubnet1
  SeoulNATRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulPublicRT
      SubnetId: !Ref SeoulNATSubnet2
  SeoulPrivateRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulPrivateRT1
      SubnetId: !Ref SeoulSubnet1
  SeoulPrivateRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulPrivateRT2
      SubnetId: !Ref SeoulSubnet2
  SeoulTGWAttRTAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulTGWAttRT
      SubnetId: !Ref SeoulTGWSubnet1
  SeoulTGWAttRTAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulTGWAttRT
      SubnetId: !Ref SeoulTGWSubnet2
      
  # NAT 인스턴스 ENI
  NATEni1:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SeoulNATSubnet1
      Description: Seoul NAT Eni 1
      GroupSet:
        - !Ref NATInstanceSG
      Tags:
        - Key: Name
          Value: NAT-Eni-1
  NATEni2:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SeoulNATSubnet2
      Description: Seoul NAT Eni 2
      GroupSet:
        - !Ref NATInstanceSG
      Tags:
        - Key: Name
          Value: NAT-Eni-2
  
  # NAT 탄력적 IP
  SeoulNATEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  SeoulNATEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  # NATENI EIP 연결
  EniAssociateEIP1:
    Type: AWS::EC2::EIPAssociation
    DependsOn: NATInstance1
    Properties:
      AllocationId: !GetAtt SeoulNATEIP1.AllocationId
      NetworkInterfaceId: !Ref NATEni1
  EniAssociateEIP2:
    Type: AWS::EC2::EIPAssociation
    DependsOn: NATInstance2
    Properties:
      AllocationId: !GetAtt SeoulNATEIP2.AllocationId
      NetworkInterfaceId: !Ref NATEni2
  
  # 보안그룹
  NATInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access Via port 22
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '443'
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
  WEBInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access Via port 22
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '443'
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
  
  # NAT 인스턴스 생성
  NATInstance1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: NAT-Instance-1
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref NATEni1
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            hostnamectl --static set-hostname Seoul-NAT1
            cat <<EOT > /etc/profile.d/prompt.sh
            export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
            EOT
            source /etc/profile
            #Egress 인터페이스 자동 추출
            IFACE="$(ip route show default | awk '/default/ {print $5; exit}')"
            #iptables 서비스 설치/활성화
            dnf install -y iptables-services
            systemctl enable --now iptables
            #IP 포워딩 상시 활성화
            cat >/etc/sysctl.d/90-nat.conf <<'EOF'
            net.ipv4.ip_forward=1
            EOF
            sysctl --system
            #NAT 규칙 초기화 및 설정
            /sbin/iptables -t nat -F
            /sbin/iptables -F FORWARD
            /sbin/iptables -P FORWARD ACCEPT
            /sbin/iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
            #규칙 영구 저장
            service iptables save
  NATInstance2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: NAT-Instance-2
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref NATEni2
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            hostnamectl --static set-hostname Seoul-NAT-2
            cat <<EOT > /etc/profile.d/prompt.sh
            export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
            EOT
            source /etc/profile
            #Egress 인터페이스 자동 추출
            IFACE="$(ip route show default | awk '/default/ {print $5; exit}')"
            #iptables 서비스 설치/활성화
            dnf install -y iptables-services
            systemctl enable --now iptables
            #IP 포워딩 상시 활성화
            cat >/etc/sysctl.d/90-nat.conf <<'EOF'
            net.ipv4.ip_forward=1
            EOF
            sysctl --system
            #NAT 규칙 초기화 및 설정
            /sbin/iptables -t nat -F
            /sbin/iptables -F FORWARD
            /sbin/iptables -P FORWARD ACCEPT
            /sbin/iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
            #규칙 영구 저장
            service iptables save
            
  # Seoul WEB Server 인스턴스
  SeoulWEB1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SeoulSubnet1
          GroupSet:
            - !Ref WEBInstanceSG
          PrivateIpAddress: 10.1.3.100
      Tags:
        - Key: Name
          Value: Seoul-WEB-1
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            (
            echo "${RootPassword}"
            echo "${RootPassword}"
            ) | passwd --stdin root
            # SSH 접속은 키 페어만 허용 (root 패스워드 로그인 미사용)
            hostnamectl --static set-hostname Seoul-WEB1
            cat <<EOT > /etc/profile.d/prompt.sh
            export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
            EOT
            source /etc/profile
            dnf install httpd -y
            echo "<h1>Seoul-WEB-1</h1>" > /var/www/html/index.html
            systemctl start httpd && systemctl enable httpd
            dnf install -y php php-cli php-common php-fpm php-mysqlnd php-mbstring php-gd php-xml php-json php-opcache php-intl php-zip
            yum install -y cronie
            systemctl start crond && systemctl enable crond

  SeoulWEB2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SeoulSubnet2
          GroupSet:
            - !Ref WEBInstanceSG
          PrivateIpAddress: 10.1.4.100
      Tags:
        - Key: Name
          Value: Seoul-WEB-2
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            (
            echo "${RootPassword}"
            echo "${RootPassword}"
            ) | passwd --stdin root
            # SSH 접속은 키 페어만 허용 (root 패스워드 로그인 미사용)
            hostnamectl --static set-hostname Seoul-WEB2
            cat <<EOT > /etc/profile.d/prompt.sh
            export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
            EOT
            source /etc/profile
            dnf install httpd -y
            echo "<h1>Seoul-WEB-2</h1>" > /var/www/html/index.html
            systemctl start httpd && systemctl enable httpd
            dnf install -y php php-cli php-common php-fpm php-mysqlnd php-mbstring php-gd php-xml php-json php-opcache php-intl php-zip
            yum install -y cronie
            systemctl start crond && systemctl enable crond
 
 # ALB 생성
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
     Scheme: internet-facing
     Name: Seoul-AWS-ALB
     SecurityGroups:
       - !Ref NATInstanceSG
     Subnets:
       - !Ref SeoulNATSubnet1
       - !Ref SeoulNATSubnet2
     
  # ALB 대상 그룹
  ALBTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ALBTG
      Port: 80
      Protocol: HTTP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      VpcId: !Ref SeoulVPC
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: 300 
      Targets:
        - Id: !Ref SeoulWEB1
          Port: 80
        - Id: !Ref SeoulWEB2
          Port: 80
      Tags:
        - Key: Name
          Value: Seoul-AWS-ALBTG
     
  # ALB 리스너 생성
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTG
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      
  # 서울 AWS 프라이빗 호스팅 영역
  PrivateSeoulDNS:
    Type: AWS::Route53::HostedZone
    DependsOn: SeoulVPC
    Properties:
      HostedZoneConfig:
        Comment: Private Webserver awsseoul.internal
      Name: awsseoul.internal
      VPCs:
        - VPCId: !Ref SeoulVPC
          VPCRegion: ap-northeast-2
      HostedZoneTags:
        - Key: Name
          Value: awsseoul-domain
          
  # AWS 프라이빗 호스팅 영역에 DNS 레코드 생성
  DNSRecordWEBInstance1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateSeoulDNS
      Comment: DNS name for AWS WEBSRV1 instance
      Name: websrv1.awsseoul.internal
      Type: A
      TTL: 60
      ResourceRecords:
        - !GetAtt SeoulWEB1.PrivateIp
  DNSRecordWEBInstance2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateSeoulDNS
      Comment: DNS name for AWS WEBSRV2 instance
      Name: websrv2.awsseoul.internal
      Type: A
      TTL: 60
      ResourceRecords:
        - !GetAtt SeoulWEB2.PrivateIp
        
  # 인바운드 엔드포인트 생성
  SeoulInboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: INBOUND
      IpAddresses:
        - Ip: 10.1.3.250
          SubnetId: !Ref SeoulSubnet1
        - Ip: 10.1.4.250
          SubnetId: !Ref SeoulSubnet2
      SecurityGroupIds:
        - !Ref WEBInstanceSG
      Tags:
        - Key: Name
          Value: Seoul-idc-to-aws-inbound
  
  # 아웃바운드 엔드포인트 생성
  SeoulOutboundEP:
    Type: AWS::Route53Resolver::ResolverEndpoint
    Properties:
      Direction: OUTBOUND
      IpAddresses:
        - Ip: 10.1.3.251
          SubnetId: !Ref SeoulSubnet1
        - Ip: 10.1.4.251
          SubnetId: !Ref SeoulSubnet2
      SecurityGroupIds:
        - !Ref WEBInstanceSG
      Tags:
        - Key: Name
          Value: Seoul-aws-to-idc-outbound
  
  # IDC로 가는 포워드 규칙
  ToIDCRule:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: "idcseoul.internal"
      RuleType: FORWARD
      ResolverEndpointId: !Ref SeoulOutboundEP
      TargetIps:
        - Ip: 10.2.1.200
      Tags:
        - Key: Name
          Value: forward-to-idc-seoul
          
  # 싱가포르 AWS로 가는 포워드 규칙
  ToSingaporeAWSRule:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: "awssingapore.internal"
      RuleType: FORWARD
      ResolverEndpointId: !Ref SeoulOutboundEP
      TargetIps:
        - Ip: 10.3.3.250 # 싱가포르 인바운드 엔드포인트 IP 1
        - Ip: 10.3.4.250 # 싱가포르 인바운드 엔드포인트 IP 2
      Tags:
        - Key: Name
          Value: forward-to-singapore-aws
      
  # 싱가포르 IDC로 가는 포워드 규칙
  ToSingaporeIDCRule:
    Type: AWS::Route53Resolver::ResolverRule
    Properties:
      DomainName: "idcsingapore.internal"
      RuleType: FORWARD
      ResolverEndpointId: !Ref SeoulOutboundEP
      TargetIps:
        - Ip: 10.4.1.200 # 싱가포르 IDC DNS 서버 IP
      Tags:
        - Key: Name
          Value: forward-to-singapore-idc

  # 포워드 규칙을 VPC에 연결
  RuleVPCAssociation:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      ResolverRuleId: !Ref ToIDCRule
      VPCId: !Ref SeoulVPC
  SingaporeAWSRuleAssociation:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      ResolverRuleId: !Ref ToSingaporeAWSRule
      VPCId: !Ref SeoulVPC
  SingaporeIDCRuleAssociation:
    Type: AWS::Route53Resolver::ResolverRuleAssociation
    Properties:
      ResolverRuleId: !Ref ToSingaporeIDCRule
      VPCId: !Ref SeoulVPC
        
  #########################################################################
  #########################################################################
  ##############################Seoul IDC VPC##############################
  ##############################Seoul IDC VPC##############################
  ##############################Seoul IDC VPC##############################
  #########################################################################
  #########################################################################
  
  # 서울 IDC
  SeoulIDC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.2.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: Seoul-IDC
          
  # Seoul IDC 인터넷 게이트웨이
  SeoulIDCIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Seoul-IDC-IGW
  SeoulIDCIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SeoulIDC
      InternetGatewayId: !Ref SeoulIDCIGW
      
  # Seoul IDC 서브넷
  SeoulIDCSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.2.1.0/24
      VpcId: !Ref SeoulIDC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: Seoul-IDC-Subnet
          
  # Seoul IDC 라우팅 테이블
  SeoulIDCRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SeoulIDC
      Tags:
        - Key: Name
          Value: Seoul-IDC-RT
          
  # Seoul IDC 라우팅
  SeoulIDCRoute:
    Type: AWS::EC2::Route
    DependsOn: SeoulIDCIGWAttachment
    Properties:
      RouteTableId: !Ref SeoulIDCRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SeoulIDCIGW
  SeoulIDCCGWRoute:
    Type: AWS::EC2::Route
    DependsOn: IDCCGWInstance
    Properties:
      RouteTableId: !Ref SeoulIDCRT
      DestinationCidrBlock: 10.0.0.0/8
      NetworkInterfaceId: !Ref CGWENI
  
  # Seoul IDC 라우팅 테이블 연결
  SeoulIDCRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref SeoulIDCRT
      SubnetId: !Ref SeoulIDCSubnet
  
  # CGW용 고정 IP 생성 및 연결
  CGWENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SeoulIDCSubnet
      Description: CGW eth0
      SourceDestCheck: false
      GroupSet:
        - !Ref CGWSG
      Tags:
        - Key: Name
          Value: CGW-ENI
  CGWEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  CGWAssociateEIP:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt CGWEIP.AllocationId
      NetworkInterfaceId: !Ref CGWENI
  
  # DNS 보안그룹
  DNSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access Via port 22
      VpcId: !Ref SeoulIDC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  # DB 보안그룹
  DBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access Via port 22
      VpcId: !Ref SeoulIDC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '443'
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '3306'
          ToPort: '3306'
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
  
  # CGW 보안그룹
  CGWSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access Via port 22
      VpcId: !Ref SeoulIDC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '53'
          ToPort: '53'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '4500'
          ToPort: '4500'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '500'
          ToPort: '500'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '3306'
          ToPort: '3306'
          CidrIp: 0.0.0.0/0
  
  # DNS서버 인스턴스
  IDCDNSSRV:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          GroupSet: 
            - !Ref DNSSG
          SubnetId: !Ref SeoulIDCSubnet
          PrivateIpAddress: 10.2.1.200
      Tags:
        - Key: Name
          Value: IDC-DNSSRV
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            hostnamectl --static set-hostname Seoul-DNS
            cat <<EOT > /etc/profile.d/prompt.sh
            export PS1="[\[\e[1;31m\]\u\[\e[m\]@\[\e[1;32m\]\h\[\e[m\]: \[\e[1;36m\]\w\[\e[m\]]#"
            EOT
            source /etc/profile
            
            dnf install -y bind bind-utils
            sed -i 's/listen-on port 53 { 127.0.0.1; };/listen-on port 53 { any; };/' /etc/named.conf
            sed -i 's/allow-query     { localhost; };/allow-query     { any; };/' /etc/named.conf
            sed -i 's/dnssec-enable yes/dnssec-enable no/g' /etc/named.conf
            sed -i 's/dnssec-validation yes/dnssec-validation no/g' /etc/named.conf
            cat << EOF >> /etc/named.rfc1912.zones
            zone "idcseoul.internal" IN {
                type master;
                file "idcseoul.internal.zone";
                allow-update { none; };
            };
            
            zone "awsseoul.internal" {
                type forward;
                forward only;
                forwarders { 10.1.3.250; 10.1.4.250; };
            };
            
            zone "awssingapore.internal" {
                type forward;
                forward only;
                forwarders { 10.3.3.250; };
            };
            
            zone "idcsingapore.internal" {
                type forward;
                forward only;
                forwarders { 10.4.1.200; };
            };

            EOF
            cat <<EOF > /var/named/idcseoul.internal.zone
            \$TTL 300
            @       IN      SOA     ns1.idcseoul.internal. admin.idcseoul.internal. (
                                    2026031101 ; Serial
                                    3600       ; Refresh
                                    1800       ; Retry
                                    604800     ; Expire
                                    300 )      ; Minimum TTL
                    IN      NS      ns1.idcseoul.internal.
            ns1     IN      A       10.2.1.200
            dnssrv  IN      A       10.2.1.200
            dbsrv   IN      A       10.2.1.100
            db      IN      CNAME   dbsrv.idcseoul.internal.
            dns     IN      CNAME   dnssrv.idcseoul.internal.
            EOF
            chown named:named /var/named/idcseoul.internal.zone
            chmod 640 /var/named/idcseoul.internal.zone
            systemctl enable --now named

  # DB서버 인스턴스
  IDCDBSRV:
    Type: AWS::EC2::Instance
