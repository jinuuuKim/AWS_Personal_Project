  # DHCP 옵션
  IDCSeoulDNSOptions:
    Type: AWS::EC2::DHCPOptions
    Properties:
      DomainName: idcseoul.internal
      DomainNameServers:
        - 10.2.1.200
        - 8.8.8.8
